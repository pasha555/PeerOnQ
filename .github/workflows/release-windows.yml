name: Windows release (SignPath)

# Builds the x64 and ARM64 MSIs from a tagged commit on GitHub-hosted runners, sends them to
# SignPath (SignPath Foundation open-source program) and attaches the verified, signed MSIs with
# SHA-256 checksums to a draft GitHub Release. See CODE_SIGNING_POLICY.md and docs/signing/APPLY.md.
#
# Tags v* use the release-signing policy (SignPath Foundation certificate, manual approval in
# SignPath). Manual runs use test-signing (SignPath test certificate) and never publish a release.
# Without the repository variable SIGNPATH_ORGANIZATION_ID the signing job is skipped and a tag
# publishes the unsigned MSIs with SHA-256 checksums as a GitHub pre-release.
#
# Required configuration (never committed):
#   secret   SIGNPATH_API_TOKEN
#   variable SIGNPATH_ORGANIZATION_ID
# Optional:
#   variables PEERONQ_SIGNALING_URL, PEERONQ_API_BASE_URL, PEERONQ_PRESENCE_URL,
#             PEERONQ_UPDATE_BASE_URL, PEERONQ_DOWNLOADS_BASE_URL, PEERONQ_DIAGNOSTICS_BASE_URL,
#             PEERONQ_RELEASE_REGION (endpoints compiled into the client; default: the public
#             peeronq.com endpoints used by scripts/windows/build-peeronq-public-pilot.ps1)
#   variable SIGNPATH_PROJECT_SLUG (default PeerOnQ),
#            SIGNPATH_ARTIFACT_CONFIGURATION_SLUG (default windows-msi-pair),
#            PEERONQ_PUBLISHER_CERTIFICATE_SHA256 (";"-separated signer fingerprints embedded in the
#            client; updates stay disabled until the manifest URL, key ID and public key exist),
#            PEERONQ_EXPECTED_PUBLISHER (default SignPath Foundation)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  libvpx:
    uses: ./.github/workflows/native-libvpx.yml

  build:
    name: Build unsigned MSIs
    needs: libvpx
    runs-on: windows-2025
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json
      - name: Download libvpx built from pinned source (x64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libvpx-win-x64
          path: artifacts/native/libvpx/x64
      - name: Download libvpx built from pinned source (arm64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libvpx-win-arm64
          path: artifacts/native/libvpx/arm64
      - name: Resolve the canonical version
        id: version
        shell: pwsh
        run: |
          . ./scripts/windows/PeerOnQ.ClientVersion.ps1
          $version = (Get-PeerOnQClientVersion -RepositoryRoot $PWD).ToString()
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match Directory.Build.props version $version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build the maintained SIPSorcery derivative from pinned source
        shell: pwsh
        run: dotnet run --project eng/PeerOnQ.DependencyBuilder -c Release -- --output eng/sipsorcery/packages
      - name: Unit tests
        shell: pwsh
        run: |
          foreach ($project in 'Domain', 'Application', 'Transport', 'Media', 'Infrastructure', 'Signaling') {
            dotnet test "tests/PeerOnQ.$project.Tests" -c Release --nologo
            if ($LASTEXITCODE -ne 0) { throw "PeerOnQ.$project.Tests failed." }
          }
      - name: Build MSIs (signing candidates, unsigned)
        shell: pwsh
        run: |
          $arguments = @{
            SigningCandidate = $true
            SkipWebsitePublish = $true
            SignalingUrl = '${{ vars.PEERONQ_SIGNALING_URL || 'wss://signal.peeronq.com/ws' }}'
            ApiBaseUrl = '${{ vars.PEERONQ_API_BASE_URL || 'https://api.peeronq.com/' }}'
            PresenceUrl = '${{ vars.PEERONQ_PRESENCE_URL || 'https://presence.peeronq.com/' }}'
            UpdateBaseUrl = '${{ vars.PEERONQ_UPDATE_BASE_URL || 'https://updates.peeronq.com/' }}'
            DownloadsBaseUrl = '${{ vars.PEERONQ_DOWNLOADS_BASE_URL || 'https://download.peeronq.com/' }}'
            DiagnosticsBaseUrl = '${{ vars.PEERONQ_DIAGNOSTICS_BASE_URL || 'https://api.peeronq.com/' }}'
            Region = '${{ vars.PEERONQ_RELEASE_REGION || 'az-1' }}'
          }
          if ('${{ vars.PEERONQ_PUBLISHER_CERTIFICATE_SHA256 }}') {
            $arguments.PublisherCertificateSha256 = '${{ vars.PEERONQ_PUBLISHER_CERTIFICATE_SHA256 }}'
          }
          ./scripts/windows/build-phase5-development.ps1 @arguments
      - name: Upload unsigned MSIs for SignPath
        id: upload
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: peeronq-${{ steps.version.outputs.version }}-unsigned
          path: dist/signing-candidate/${{ steps.version.outputs.version }}/PeerOnQ-*.msi
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign with SignPath and verify
    needs: build
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    runs-on: windows-2025
    # Release signing waits for a manual approval in SignPath.
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Submit the signing request
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'PeerOnQ' }}
          signing-policy-slug: ${{ github.ref_type == 'tag' && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'windows-msi-pair' }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 21000
          output-artifact-directory: signed
      - name: Verify signatures and write checksums
        shell: pwsh
        run: |
          ./scripts/windows/verify-signed-release.ps1 `
            -Directory signed `
            -Policy '${{ github.ref_type == 'tag' && 'release' || 'test' }}' `
            -ExpectedPublisher '${{ vars.PEERONQ_EXPECTED_PUBLISHER || 'SignPath Foundation' }}' `
            -AllowedPublisherSha256 '${{ vars.PEERONQ_PUBLISHER_CERTIFICATE_SHA256 }}' `
            -SummaryPath $env:GITHUB_STEP_SUMMARY
      - name: Upload signed MSIs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: peeronq-${{ needs.build.outputs.version }}-signed
          path: |
            signed/**/PeerOnQ-*.msi
            signed/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish the GitHub Release
    needs: [build, sign]
    # Runs for tags after a successful build: with the signed MSIs when signing ran, otherwise
    # (no SignPath configuration yet) with the unsigned MSIs as a pre-release.
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.build.result == 'success' && needs.sign.result != 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SIGNED: ${{ needs.sign.result == 'success' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Download the signed MSIs
        if: ${{ needs.sign.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: peeronq-${{ needs.build.outputs.version }}-signed
          path: release
      - name: Download the unsigned MSIs
        if: ${{ needs.sign.result != 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: peeronq-${{ needs.build.outputs.version }}-unsigned
          path: release
      - name: Checksums and release notes
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p assets
          find release -type f -name 'PeerOnQ-*.msi' -exec cp {} assets/ \;
          count=$(find assets -name 'PeerOnQ-*.msi' | wc -l)
          [ "$count" -eq 2 ] || { echo "Expected the x64 and ARM64 MSIs, found $count." >&2; exit 1; }
          (cd assets && sha256sum PeerOnQ-*.msi > SHA256SUMS.txt && cat SHA256SUMS.txt)
          repo="https://github.com/$GITHUB_REPOSITORY"
          {
            if [ "$SIGNED" != "true" ]; then
              echo "**Unsigned.** Code signing via SignPath Foundation is pending."
              echo
            fi
            echo "Windows installers (x64, ARM64) built by GitHub Actions from \`$TAG\`. Verify downloads with \`SHA256SUMS.txt\`."
            echo
            echo "Windows installers are code-signed through SignPath.io with a certificate by SignPath Foundation (free code signing for open source). Until the application is accepted, installers are published unsigned. [Code signing policy →](https://peeronq.com/code-signing)"
            echo
            echo "## Changes"
            echo
            awk -v version="$VERSION" '
              $0 ~ "^## " version "( |$)" { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "## Links"
            echo
            echo "- [Release notes and upgrade steps]($repo/blob/$TAG/src/PeerOnQ.Infrastructure.Deployment/RELEASE_NOTES.md)"
            echo "- [Code signing policy]($repo/blob/$TAG/CODE_SIGNING_POLICY.md)"
            echo "- [Privacy policy](https://peeronq.com/privacy) ([source]($repo/blob/$TAG/docs/PRIVACY.md))"
            echo "- [Known limitations]($repo/blob/$TAG/docs/KNOWN_LIMITATIONS.md)"
          } > notes.md
          cat notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find assets -type f | sort)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          elif [ "$SIGNED" = "true" ]; then
            gh release create "$TAG" "${files[@]}" --draft --verify-tag --repo "$GITHUB_REPOSITORY" \
              --title "PeerOnQ $VERSION" --notes-file notes.md
          else
            gh release create "$TAG" "${files[@]}" --prerelease --verify-tag --repo "$GITHUB_REPOSITORY" \
              --title "PeerOnQ $VERSION (unsigned)" --notes-file notes.md
          fi
