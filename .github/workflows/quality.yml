name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  libvpx:
    uses: ./.github/workflows/native-libvpx.yml

  dotnet:
    needs: libvpx
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json
      - name: Download libvpx built from pinned source (x64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libvpx-win-x64
          path: artifacts/native/libvpx/x64
      - name: Maintained dependency builder security self-tests
        run: dotnet run --project eng/PeerOnQ.DependencyBuilder -c Release -- --self-test
      - name: Maintained dependency incremental copy/hash regression
        shell: pwsh
        run: ./scripts/windows/test-maintained-sipsorcery-copy.ps1
      - name: Restore
        shell: pwsh
        run: |
          dotnet run --project eng/PeerOnQ.DependencyBuilder -c Release -- --output eng/sipsorcery/packages
          if ($LASTEXITCODE -ne 0) { throw 'Maintained dependency bootstrap failed.' }
          dotnet restore PeerOnQ.slnx
          if ($LASTEXITCODE -ne 0) { throw 'Solution restore failed.' }
          dotnet restore installer/PeerOnQ.Installer.wixproj
          if ($LASTEXITCODE -ne 0) { throw 'Installer restore failed.' }
      - name: Canonical Windows client version invariant
        shell: pwsh
        run: ./scripts/windows/test-peeronq-client-version-invariant.ps1
      - name: Server and client release version invariant
        shell: pwsh
        run: ./scripts/windows/test-peeronq-server-run-invariant.ps1
      - name: Canonical Linux viewer version invariant
        shell: bash
        run: bash ./scripts/linux/test-peeronq-linux-viewer-version.sh
      - name: Canonical Android viewer version invariant
        shell: pwsh
        run: ./scripts/android/test-peeronq-android-viewer-version.ps1
      - name: Build with static analysis
        run: >-
          dotnet build PeerOnQ.slnx --no-restore -c Release
          -p:ContinuousIntegrationBuild=true -p:EnableNETAnalyzers=true
          -p:AnalysisLevel=latest -warnaserror
      - name: Unit and integration tests
        # Do not overlap latency/throughput acceptance with builds or other test projects.
        run: dotnet test PeerOnQ.slnx --no-restore --no-build -m:1 -c Release --nologo
      - name: Native QUIC 1 GiB per minute regression gate
        timeout-minutes: 3
        env:
          PEERONQ_LIVE_QUIC_TRANSFER_BYTES: "1073741824"
        run: >-
          dotnet test tests/PeerOnQ.Transport.Tests/PeerOnQ.Transport.Tests.csproj
          --no-restore --no-build -c Release --nologo
          --filter FullyQualifiedName=PeerOnQ.Transport.Tests.ManagedQuicRemoteSessionTransportTests.FileLaneMeetsOneGiBPerMinuteWhileInteractiveLaneStaysResponsive
      - name: Dependency vulnerability scan
        shell: pwsh
        run: |
          dotnet list PeerOnQ.slnx package --vulnerable --include-transitive --format json | Out-File dotnet-vulnerabilities.json -Encoding utf8
          $report = Get-Content dotnet-vulnerabilities.json -Raw | ConvertFrom-Json -Depth 64
          $blocked = @($report.projects | ForEach-Object { $_.frameworks } | ForEach-Object {
            @($_.topLevelPackages) + @($_.transitivePackages)
          } | ForEach-Object { $_.vulnerabilities } | Where-Object { $_.severity -in 'High', 'Critical' })
          if ($blocked.Count -gt 0) { throw "High/critical .NET vulnerabilities found: $($blocked.Count)" }
      - name: Maintained dependency upstream advisory scan
        shell: pwsh
        run: ./scripts/security/test-sipsorcery-upstream-advisories.ps1
      - name: Repository secret patterns
        shell: pwsh
        run: ./scripts/security/scan-repository-secrets.ps1

  cloud-persistence:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: peeronq_ci
          POSTGRES_USER: peeronq_ci
          # Ephemeral CI-only database; never reused by any deployment.
          POSTGRES_PASSWORD: peeronq-ci-ephemeral
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U peeronq_ci -d peeronq_ci" --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:8.4.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json
      - name: Execute required PostgreSQL and Redis security integration tests
        env:
          PEERONQ_REQUIRE_EXTERNAL_INTEGRATION: "true"
          PEERONQ_TEST_POSTGRES: Host=localhost;Port=5432;Database=peeronq_ci;Username=peeronq_ci;Password=peeronq-ci-ephemeral
          PEERONQ_TEST_REDIS: localhost:6379,abortConnect=false
        run: >-
          dotnet test tests/PeerOnQ.Cloud.Infrastructure.Tests/PeerOnQ.Cloud.Infrastructure.Tests.csproj
          -c Release --nologo --filter Category=ExternalIntegration

  web-workspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format release-critical configuration
        run: >-
          pnpm exec prettier --check ".github/workflows/*.yml" package.json global.json
          .config/dotnet-tools.json scripts/check-package-manager.mjs
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
        env:
          PORT: "23586"
          BASE_PATH: "/"
      - run: pnpm audit --audit-level high

  production-ingress:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate merged public URLs and internal port boundaries
        run: node scripts/test-peeronq-compose-contract.mjs
      - name: Validate installer publication checks and production TLS ingress
        run: |
          docker run --rm \
            --mount "type=bind,source=$PWD,target=/repo,readonly" \
            --mount "type=bind,source=$PWD/src/PeerOnQ.Infrastructure.Deployment,target=/workspace,readonly" \
            --entrypoint sh \
            nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236 \
            -ec 'apk add --no-cache openssl >/dev/null; sh /repo/scripts/linux/test-peeronq-bootstrap-compose-contract.sh; sh /workspace/scripts/validate-nginx.sh /repo/scripts/linux/peeronq-server-installer.sh'

  web-images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        surface: [peeronq, peeronq-admin, peeronq-portal]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build production web image with frozen dependencies
        run: docker build --progress=plain -f artifacts/${{ matrix.surface }}/Dockerfile -t peeronq-ci-${{ matrix.surface }} .

  secret-history:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Matches the publication gate; .gitleaks.toml uses [[allowlists]] (gitleaks 8.25+).
          GITLEAKS_VERSION: 8.28.0
