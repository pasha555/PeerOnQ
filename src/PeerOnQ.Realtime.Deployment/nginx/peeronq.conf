map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream peeronq_signaling {
    least_conn;
    server signaling-1:8080 max_fails=3 fail_timeout=10s;
    server signaling-2:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name signal.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name signal.example.com;

    ssl_certificate /etc/letsencrypt/live/signal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signal.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /ws {
        proxy_pass http://peeronq_signaling;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
        proxy_send_timeout 15s;
        proxy_buffering off;
        client_max_body_size 64k;
    }

    location = /health/live {
        proxy_pass http://peeronq_signaling;
    }

    location = /health/ready {
        proxy_pass http://peeronq_signaling;
    }

    location = /metrics {
        deny all;
    }
}
