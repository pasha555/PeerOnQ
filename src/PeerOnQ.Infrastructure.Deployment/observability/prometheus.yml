global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    product: peeronq

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:9464]
  - job_name: cloud-api
    metrics_path: /metrics
    file_sd_configs:
      - files: [/etc/prometheus/targets/cloud-api.json]
        refresh_interval: 30s
  - job_name: admin-api
    metrics_path: /metrics
    static_configs:
      - targets: [admin-api:8080]
  - job_name: presence
    metrics_path: /metrics
    file_sd_configs:
      - files: [/etc/prometheus/targets/presence.json]
        refresh_interval: 30s
  - job_name: downloads
    metrics_path: /metrics
    file_sd_configs:
      - files: [/etc/prometheus/targets/downloads.json]
        refresh_interval: 30s
  - job_name: signaling
    metrics_path: /metrics
    file_sd_configs:
      - files: [/etc/prometheus/targets/signaling.json]
        refresh_interval: 30s
  - job_name: local-phase3-signaling
    metrics_path: /metrics
    file_sd_configs:
      - files: [/etc/prometheus/targets/local-phase3.json]
        refresh_interval: 30s
  - job_name: coturn
    metrics_path: /metrics
    static_configs:
      - targets: [turn:9641]
  - job_name: dependency-probes
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - postgres:5432
          - redis:6379
          - turn:3478
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
