server {
  listen 80 default_server;
  server_name _;
  return 444;
}

# Unknown SNI must not select the public website. A known TLS name followed by an
# unknown HTTP Host is also rejected after virtual-server selection.
server {
  listen 443 ssl default_server;
  server_name _;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_reject_handshake on;
  access_log off;
  return 444;
}
