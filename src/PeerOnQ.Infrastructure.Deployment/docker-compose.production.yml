name: peeronq-phase6-production

# Apply this fail-closed production override after docker-compose.staging.yml.
# The standalone installer validates the merged model before changing a running stack.
services:
  proxy:
    image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236

  cloud-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PeerOnQ__DiagnosticsStorage__Provider: FileSystem
      PeerOnQ__DiagnosticsStorage__FileSystemPath: /var/lib/peeronq/diagnostics
      PeerOnQ__DiagnosticsStorage__AllowFileSystemOutsideDevelopment: ${PEERONQ_DIAGNOSTICS_ALLOW_SINGLE_NODE_FILESYSTEM:-false}

  presence:
    environment:
      ASPNETCORE_ENVIRONMENT: Production

  admin-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PeerOnQ__AdminTokens__AllowMfaBypassForDevelopment: "false"
      AdminBootstrap__Enabled: ${PEERONQ_ADMIN_BOOTSTRAP_ENABLED:-false}
      PeerOnQ__PlatformUpgrade__Enabled: ${PEERONQ_PLATFORM_UPGRADE_ENABLED:?set PEERONQ_PLATFORM_UPGRADE_ENABLED}

  downloads:
    environment:
      ASPNETCORE_ENVIRONMENT: Production

  signaling:
    environment:
      ASPNETCORE_ENVIRONMENT: Production

  signaling-metrics:
    image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236

  release-storage-init:
