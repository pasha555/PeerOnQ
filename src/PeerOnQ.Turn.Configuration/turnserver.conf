# PeerOnQ coturn baseline. Secrets, realm, public IP and certificates are injected at runtime.
listening-port=3478
min-port=49160
max-port=49200
pidfile=/tmp/turnserver.pid

fingerprint
use-auth-secret
stale-nonce=600
unauthorized-ratelimit
unauthorized-ratelimit-rps=10
max-allocate-timeout=30
no-auth-pings
no-dynamic-ip-list
no-dynamic-realms

# Abuse controls. Tune from measured production load; do not remove without review.
user-quota=4
total-quota=1000
max-bps=10000000
bps-capacity=1000000000
no-multicast-peers
no-software-attribute

# UDP and TCP listeners stay enabled. TLS/DTLS is enabled by the entrypoint when certs exist.
# The current coturn release keeps CLI disabled by default and uses the OpenSSL system policy.
# Local acceptance verifies the mounted certificate for TLS and DTLS connections.

# Low-cardinality operational metrics; never enable the web admin interface.
prometheus
prometheus-port=9641

log-file=stdout
simple-log
